<!DOCTYPE html>
<!--
  This is the only HTML file in a React app. React builds every page inside
  <div id="root"> using JavaScript, so moving between pages never reloads the
  browser. This is called a "single-page application" (SPA).
-->
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Hearth & Grain: solid-wood furniture, lighting and homeware, made to be lived with." />
    <meta name="theme-color" content="#f6f5f1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" />
    <title>Hearth &amp; Grain: Furniture &amp; Homeware</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite loads our app from here. type="module" lets us use import/export. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
